spring.application.name=codepilot-ai

server.port=8080
spring.profiles.active=local

spring.datasource.url=jdbc:postgresql://localhost:5433/codepilot?options=-c%20TimeZone=Asia/Kolkata
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.ai.google.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3-flash-preview
codepilot.embedding.model=gemini-embedding-001
spring.ai.vectorstore.qdrant.enabled=false

spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=codepilot
spring.ai.vectorstore.qdrant.initialize-schema=true

debug = true
logging.level.com.zaxxer.hikari=DEBUG
#spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Kolkata'