
spring.application.name=codepilot-ai

server.port=8080


# ==========================
# Database
# ==========================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================
# Google Gemini
# ==========================
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3-flash-preview

# ==========================
# Embedding
# ==========================
codepilot.embedding.model=gemini-embedding-001

# ==========================
# Qdrant
# ==========================
spring.ai.vectorstore.qdrant.enabled=false
spring.ai.vectorstore.qdrant.host=${QDRANT_HOST}
spring.ai.vectorstore.qdrant.port=${QDRANT_PORT}
spring.ai.vectorstore.qdrant.collection-name=codepilot
spring.ai.vectorstore.qdrant.initialize-schema=true

# ==========================
# Search
# ==========================
codepilot.search.score-threshold=0.75

# ==========================
# Repository Storage
# ==========================
codepilot.repository.root-path=${REPOSITORY_ROOT}

# ==========================
# Logging
# ==========================
logging.level.root=INFO
logging.level.com.codepilot=INFO
logging.level.org.springframework=INFO
logging.level.com.zaxxer.hikari=INFO

# ==========================
# Spring Boot Actuator
# ==========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

#============================
app.frontend.url=${FRONTEND_URL}